name: Update ice weather DB

on:
  schedule:
    - cron: "17 10 * * *" 
  workflow_dispatch: 

# No parallel runs
concurrency:
  group: update-ice-weather-db
  cancel-in-progress: false

permissions:
  contents: read

env:
  FRONTEND_REPO: AlxClt/IceClimbingWatch
  FRONTEND_BRANCH: main
  EXPORT_FILES: v_series_daily_21d.csv

jobs:
  update:
    runs-on: ubuntu-latest
    # The client-side rate limiter may pause for a while on large backfills.
    timeout-minutes: 120

    steps:
      - name: Check out backend repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The database and CSVs are not tracked in git: the DB is rebuilt on every run
      # (21 days of history backfilled) and only the CSVs are pushed to the frontend repo.
      - name: Update database and export CSVs
        run: python scripts/update_ice_weather_db.py

      - name: Check out frontend repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_BRANCH }}
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend

      - name: Push CSV exports to frontend repo
        working-directory: frontend
        run: |
          mkdir -p data
          for f in $EXPORT_FILES; do
            cp "../data/exports/$f" "data/$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # Always commit and push, even when the CSVs are unchanged (empty commit).
          git commit --allow-empty -m "Update ice weather CSV exports $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:$FRONTEND_BRANCH
