# Alembic configuration of the outing weather tables (same database as the c2c scraper).
# Migrations are applied automatically at startup by outing_weather.db.migrate_db (main.py).
# This history only manages the tables of outing_weather.schema.OWN_TABLES, and keeps its
# revision in its own table, alembic_version_weather (the c2c scraper uses alembic_version).
# CLI use (from weather_scraper/, with DATABASE_URL set):
#   alembic revision --autogenerate -m "describe the change"
#   alembic check
# There is no sqlalchemy.url here: env.py reads DATABASE_URL.
# There are no logging sections on purpose: the app configures logging.

[alembic]
script_location = %(here)s/outing_weather/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os
