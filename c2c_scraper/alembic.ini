# Alembic configuration of the camptocamp scraper database.
# Migrations are applied automatically at startup by c2c.db.migrate_db (main.py).
# CLI use (from c2c_scraper/, with DATABASE_URL set):
#   alembic revision --autogenerate -m "describe the change"
#   alembic check
# There is no sqlalchemy.url here: env.py reads DATABASE_URL.
# There are no logging sections on purpose: the app configures logging (c2c/logging_config.py).

[alembic]
script_location = %(here)s/c2c/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os
